name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: for f in frontend/*.js; do node --check "$f"; done
      - name: Unit tests
        run: node --test frontend/tests/*.test.js

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t liveapi-demo-app .
      - name: Serves the frontend and /healthz
        run: |
          docker run -d --name app -p 8080:8080 liveapi-demo-app
          for i in $(seq 30); do curl -sf localhost:8080/healthz && break; sleep 1; done
          curl -sf localhost:8080/ | grep -q "Gemini Live"
          docker stop app
