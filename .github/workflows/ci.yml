name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Lint
        run: ruff check backend scripts && ruff format --check backend scripts
      - name: Type check
        run: pyright
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Syntax check
        run: for f in frontend/*.js; do node --check "$f"; done
      - name: Unit tests
        run: node --test frontend/tests/*.test.js

  e2e:
    # The app in headless Chrome and Firefox against scripts/mock_live_api.py,
    # which needs no credentials. The runner image ships /usr/bin/google-chrome;
    # Firefox is Playwright's build, matching the pinned playwright-core.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: pip install -r backend/requirements.txt
      - run: npm ci
      - if: matrix.browser == 'firefox'
        run: npx playwright-core install --with-deps firefox
      - name: Browser e2e against the mock Live API
        run: |
          python scripts/mock_live_api.py --port=8765 > mock.log 2>&1 &
          PORT=8080 python backend/main.py --common_bag_ws_port=8765 > server.log 2>&1 &
          for i in $(seq 30); do curl -sf localhost:8080/healthz && break; sleep 1; done
          npm run e2e -- --mock --server=http://localhost:8080 --browser=${{ matrix.browser }}
      - name: Smoke test against the mock Live API
        if: matrix.browser == 'chromium' # No browser; once is enough.
        run: |
          for modality in AUDIO TEXT VIDEO; do
            python scripts/smoke_test.py --server=http://localhost:8080 \
              --environment=autopush-common --model=gemini-3.8-live \
              --modality=$modality --timeout=20
          done
      - name: Server and mock logs
        if: failure()
        run: cat server.log mock.log

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t liveapi-demo-app .
      - name: Serves the frontend and /healthz
        run: |
          docker run -d --name app -p 8080:8080 liveapi-demo-app
          for i in $(seq 30); do curl -sf localhost:8080/healthz && break; sleep 1; done
          curl -sf localhost:8080/ | grep -q "Gemini Live"
          docker stop app
      - name: Container logs
        if: failure()
        run: docker logs app
