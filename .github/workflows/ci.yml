name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Lint
        run: ruff check backend scripts && ruff format --check backend scripts
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: for f in frontend/*.js; do node --check "$f"; done
      - name: Unit tests
        run: node --test frontend/tests/*.test.js

  e2e:
    # The app in headless Chrome against scripts/mock_live_api.py, which needs
    # no credentials. The runner image ships /usr/bin/google-chrome.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -r backend/requirements.txt
      - run: npm ci
      - name: Browser e2e against the mock Live API
        run: |
          python scripts/mock_live_api.py --port=8765 > mock.log 2>&1 &
          PORT=8080 python backend/main.py --common_bag_ws_port=8765 > server.log 2>&1 &
          for i in $(seq 30); do curl -sf localhost:8080/healthz && break; sleep 1; done
          npm run e2e -- --mock --server=http://localhost:8080
      - name: Server and mock logs
        if: failure()
        run: cat server.log mock.log

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t liveapi-demo-app .
      - name: Serves the frontend and /healthz
        run: |
          docker run -d --name app -p 8080:8080 liveapi-demo-app
          for i in $(seq 30); do curl -sf localhost:8080/healthz && break; sleep 1; done
          curl -sf localhost:8080/ | grep -q "Gemini Live"
          docker stop app
