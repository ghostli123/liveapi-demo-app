[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff.lint]
# Errors and likely bugs; formatting is `ruff format`'s job.
select = ["E4", "E7", "E9", "F", "B"]

[tool.pyright]
include = ["backend", "scripts"]
# Backend modules import each other by bare name, and the tests import the mock.
extraPaths = ["backend", "scripts"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
